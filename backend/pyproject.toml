[project]
name = "dita-backend"
version = "1.0.0"
description = "Dita AI Assistant - WebSocket API Server"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115.6",
    "uvicorn[standard]>=0.34.0",
    "python-multipart>=0.0.20",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

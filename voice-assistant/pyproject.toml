[project]
name = "dita-ai-assistant"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "elasticsearch==8.12.0",
    "fastapi>=0.121.2",
    "google-cloud-texttospeech>=2.33.0",
    "google-genai>=1.49.0",
    "langchain>=1.0.5",
    "langchain-community>=0.4.1",
    "langchain-core>=1.0.4",
    "langchain-google-genai>=3.0.1",
    "langchain-huggingface>=1.0.1",
    "langchain-text-splitters>=1.0.0",
    "numpy>=2.3.4",
    "pvporcupine>=3.0.5",
    "pyaudio>=0.2.14",
    "python-dotenv>=1.2.1",
    "python-multipart>=0.0.20",
    "requests>=2.28.1",
    "silero-vad>=6.2.0",
    "sounddevice>=0.5.3",
    "streamlit>=1.51.0",
    "torch>=2.9.0",
    "transformers>=4.57.1",
    "uvicorn>=0.38.0",
    "websocket-client>=1.8.0",
    "websockets>=15.0.1",
]

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"

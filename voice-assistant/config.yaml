# API Keys and Secrets
api_keys:
  porcupine: ${PORCUPINE_ACCESS_KEY}
  gemini: ${GEMINI_API_KEY}
  elasticsearch: ${ES_PASSWORD}

# Authentication Configuration
auth:
  backend_url: "http://localhost:8000"
  required: true  # Set to false to disable authentication
  token_refresh_threshold_minutes: 5  # Refresh token if expires in less than this

# Elasticsearch Configuration
elasticsearch:
  host: "10.17.5.106"
  port: 9200
  username: "elastic"
  password: ${ES_PASSWORD}
  timeout: 20
  max_retries: 3
  retry_on_timeout: true
  http_compress: true
  
# News Search Configuration
news_search:
  index_name: "news_2025.08"
  # Data scope filter 
  data_scope:
    keyword_filter: "polisi"  
  max_results: 10
  date_boost_factor: 1.5
  summary_max_length: 300
  source_diversity: true

# Language Models Configuration
llm:
  # Primary LLM
  primary:
    provider: "google_gemini"
    api_key_name: "GEMINI_API_KEY" 
    model_name: "gemini-2.5-flash"
    temperature: 0.1
    max_tokens: 2048
    timeout: 30
  
  # Fallback LLM
  fallback:
    provider: "google_gemini"
    api_key_name: "GEMINI_API_KEY"
    model_name: "gemini-2.0-flash-exp"
    temperature: 0.1
    max_tokens: 1024

# Speech-to-Text Configuration
stt:
  model_name: "kingabzpro/wav2vec2-large-xls-r-1b-indonesian"
  sample_rate: 16000
  default_duration: 5

# Voice Activity Detection Configuration
vad:
  enabled: true
  model: "silero"
  threshold: 0.5
  
  silence_threshold_seconds: 1.0
  min_recording_seconds: 0.5
  max_recording_seconds: 30
  
  sample_rate: 16000
  channels: 1

# Text-to-Speech Configuration
tts:
  enabled: true
  provider: "google_cloud"
  
  language_code: "id-ID"
  voice_name: "id-ID-Standard-D" 
  speaking_rate: 1.0
  pitch: 0.0
  
  save_responses: false
  response_dir: "responses/"
  device: "cpu"  # or "cuda" if available

# Wake Word Detection
wakeword:
  model_path: "models/hey-dita_linux.ppn"
  # model_path: "models/hello-dita_mac.ppn"
  sensitivity: 0.5
  audio_device_index: -1  # -1 for default device

# Audio Processing
audio:
  input:
    sample_rate: 16000
    channels: 1
    dtype: "float32"
    device_index: -1  # -1 for default
  
  processing:
    noise_reduction: False
    voice_activity_detection: False

# Dashboard Configuration
dashboard:
  backend:
    host: "0.0.0.0"
    port: 8000
    cors_origins:
      - "http://localhost:5173"
      - "http://localhost:5174"
      - "http://localhost:3000"
  
  frontend:
    websocket_url: "ws://localhost:8000/ws/dashboard"
    api_base_url: "http://localhost:8000"
    reconnect_interval_ms: 3000
    ping_interval_ms: 30000